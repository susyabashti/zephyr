# CI: build, unit + phase tests, format check, and the byte-exact gates on
# every pull request and push to main. The retrieval eval (real model) and
# the 100k round trip are slow, so they run only on pushes to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0

# A new push or PR commit supersedes in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + tests + gates (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official ziglang.org release tarballs for ${{ env.ZIG_VERSION }};
          # shasums from ziglang.org/download/index.json.
          - runner: macos-15
            zig-tarball: zig-aarch64-macos-0.17.0.tar.xz
            zig-shasum: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          - runner: ubuntu-22.04
            zig-tarball: zig-x86_64-linux-0.17.0.tar.xz
            zig-shasum: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - runner: ubuntu-24.04-arm
            zig-tarball: zig-aarch64-linux-0.17.0.tar.xz
            zig-shasum: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Zig ${{ env.ZIG_VERSION }} (official tarball, sha256-verified)
        run: |
          set -eu
          name="${{ matrix.zig-tarball }}"
          expected="${{ matrix.zig-shasum }}"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/${name}"
          actual="$( (shasum -a 256 zig.tar.xz 2>/dev/null || sha256sum zig.tar.xz) | cut -d' ' -f1 )"
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          tar xJf zig.tar.xz
          mv "${name%.tar.xz}" zig-toolchain
          echo "${GITHUB_WORKSPACE}/zig-toolchain" >> "$GITHUB_PATH"
          ./zig-toolchain/zig version
      # Key inputs: the pinned submodule revision, build.zig (the whole
      # cmake invocation lives there), and the host C++ compiler (the real
      # compiler on macOS; on Linux the engine is built by zig cc/c++, which
      # ZIG_VERSION already pins). Any change -> new key -> clean build.
      - name: Cache key inputs (submodule pin, build.zig, compiler)
        id: pins
        run: |
          set -eu
          llama_pin="$(git -C third_party/llama.cpp rev-parse HEAD)"
          build_hash="$( (shasum -a 256 build.zig 2>/dev/null || sha256sum build.zig) | cut -d' ' -f1 )"
          cc_hash="$(c++ --version | head -n 1 | (shasum -a 256 2>/dev/null || sha256sum) | cut -d' ' -f1 )"
          {
            echo "llama=$llama_pin"
            echo "build=$build_hash"
            echo "cc=$cc_hash"
          } >> "$GITHUB_OUTPUT"
      # Warm cache => cmake reconfigure is a no-op and ninja has nothing to
      # do; a miss rebuilds the static library set for this OS/arch.
      - name: llama.cpp build cache
        uses: actions/cache@v6
        with:
          path: zig-out/llama
          key: llama-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-llama${{ steps.pins.outputs.llama }}-bld${{ steps.pins.outputs.build }}-cc${{ steps.pins.outputs.cc }}
      # A fresh checkout stamps every source with the current mtime, and
      # ninja (mtime-based) would see them as newer than the cached objects
      # and rebuild all targets. Pin the sources to a fixed old date; content
      # changes are still caught because the pin and build.zig hash the key.
      # The touch also invalidates the submodule index's stat cache: the first
      # cold `git diff-index` (run by llama.cpp's CMake to stamp
      # ggml-version.h) would then see a "dirty" tree and rewrite the header
      # with a new mtime, forcing ninja to rebuild the one file that includes
      # it (ggml.c.o). `update-index --refresh` re-stats every file (content
      # unchanged -> clean) so the stamped header stays byte-identical to the
      # cached one.
      - name: Pin submodule source mtimes (ninja is mtime-based)
        run: |
          find third_party/llama.cpp -type f -exec touch -t 202001010000 {} +
          git -C third_party/llama.cpp update-index --refresh
      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Unit + phase tests
        run: zig build test
      - name: Format check
        run: zig build fmt
      - name: Gates (byte-exact)
        run: |
          python3 test/reference.py --check
          python3 test/otsref.py --check
          python3 test/mcpref.py --check
          python3 test/derivedref.py --check
          python3 test/semref.py --check
      - name: Structural gate (layering + map)
        run: python3 test/structure.py --check

  eval:
    name: retrieval eval (main only)
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    env:
      ZIG_TARBALL: zig-aarch64-macos-0.17.0.tar.xz
      ZIG_SHASUM: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Zig ${{ env.ZIG_VERSION }} (official tarball, sha256-verified)
        run: |
          set -eu
          name="${{ env.ZIG_TARBALL }}"
          expected="${{ env.ZIG_SHASUM }}"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/${name}"
          actual="$( (shasum -a 256 zig.tar.xz 2>/dev/null || sha256sum zig.tar.xz) | cut -d' ' -f1 )"
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          tar xJf zig.tar.xz
          mv "${name%.tar.xz}" zig-toolchain
          echo "${GITHUB_WORKSPACE}/zig-toolchain" >> "$GITHUB_PATH"
          ./zig-toolchain/zig version
      # Same cache as the macos-15 matrix job: identical key inputs.
      - name: Cache key inputs (submodule pin, build.zig, compiler)
        id: pins
        run: |
          set -eu
          llama_pin="$(git -C third_party/llama.cpp rev-parse HEAD)"
          build_hash="$( (shasum -a 256 build.zig 2>/dev/null || sha256sum build.zig) | cut -d' ' -f1 )"
          cc_hash="$(c++ --version | head -n 1 | (shasum -a 256 2>/dev/null || sha256sum) | cut -d' ' -f1 )"
          {
            echo "llama=$llama_pin"
            echo "build=$build_hash"
            echo "cc=$cc_hash"
          } >> "$GITHUB_OUTPUT"
      - name: llama.cpp build cache
        uses: actions/cache@v6
        with:
          path: zig-out/llama
          key: llama-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-llama${{ steps.pins.outputs.llama }}-bld${{ steps.pins.outputs.build }}-cc${{ steps.pins.outputs.cc }}
      - name: Pin submodule source mtimes (ninja is mtime-based)
        # See the identical step in the test job: the refresh keeps the
        # ggml-version.h stamp byte-identical to the cached header.
        run: |
          find third_party/llama.cpp -type f -exec touch -t 202001010000 {} +
          git -C third_party/llama.cpp update-index --refresh
      - name: Build (ReleaseFast)
      # The key embeds the pinned sha256 (src/embed/model.zig): a changed
      # pin misses the cache, and `model fetch` re-verifies any cached file.
      - name: Embedding model (cached)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.zephyr/models
          key: zephyr-embeddinggemma-300M-q8-0-a0f7b4e13c397a6e
      - name: Fetch the model if the cache missed
        run: |
          HOME="${RUNNER_TEMP}" ./zig-out/bin/zephyr model fetch
          echo "ZEPHYR_EMBED_MODEL=${RUNNER_TEMP}/.zephyr/models/embeddinggemma-300M-Q8_0.gguf" >> "$GITHUB_ENV"
      - name: Retrieval eval (section 8)
        run: python3 test/semref.py --eval

  roundtrip:
    name: 100k round trip (main only)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    env:
      ZIG_TARBALL: zig-x86_64-linux-0.17.0.tar.xz
      ZIG_SHASUM: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig ${{ env.ZIG_VERSION }} (official tarball, sha256-verified)
        run: |
          set -eu
          name="${{ env.ZIG_TARBALL }}"
          expected="${{ env.ZIG_SHASUM }}"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/${name}"
          actual="$( (shasum -a 256 zig.tar.xz 2>/dev/null || sha256sum zig.tar.xz) | cut -d' ' -f1 )"
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          tar xJf zig.tar.xz
          mv "${name%.tar.xz}" zig-toolchain
          echo "${GITHUB_WORKSPACE}/zig-toolchain" >> "$GITHUB_PATH"
          ./zig-toolchain/zig version
      - name: Round trip (ReleaseFast)
        run: zig build roundtrip -Doptimize=ReleaseFast
